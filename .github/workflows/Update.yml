name: IPTV Update

on:
  schedule:
    - cron: "0 0 * * *"   # 每天运行一次
  workflow_dispatch:

jobs:
  update-iptv:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Download remote txt
        run: |
          curl -sL "https://raw.githubusercontent.com/redrainl/iptv/main/speedtest/txt/fofa_Shanghai_103.txt" -o raw.txt

      - name: 准备频道文件
        run: |
          # 提取 CCTV 和 卫视频道，排除坏行
          grep -E 'CCTV|卫视' fofa_Shanghai_103.txt | grep -v 'http:///udp/' > filtered.txt

          # 去重
          sort -u filtered.txt > deduped.txt

          # 统计数量
          cctv_count=$(grep -c 'CCTV' deduped.txt || true)
          weishi_count=$(grep -c '卫视' deduped.txt || true)
          total=$((cctv_count + weishi_count))

          echo "✅ 频道统计:"
          echo "   CCTV: $cctv_count 个"
          echo "   卫视: $weishi_count 个"
          echo "   总计: $total 个"

          # 生成 iptv.m3u
          echo "#EXTM3U" > iptv.m3u
          awk -F, '{print "#EXTINF:-1," $1; print $2}' deduped.txt >> iptv.m3u

      - name: Commit and Push if changed
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # 检查 iptv.m3u 是否新增或修改
          if [ -n "$(git status --porcelain iptv.m3u)" ]; then
            git add iptv.m3u
            git commit -m "Update IPTV playlist [$(date '+%Y-%m-%d %H:%M:%S')]"
            git push
          else
            echo "No changes detected, skip commit."
          fi
